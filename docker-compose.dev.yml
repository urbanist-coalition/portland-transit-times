services:
  redis:
    image: redis:latest
    container_name: transit-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data

  # The same nginx and the same config as production, over the working tree:
  # Eleventy's output, the worker's JSON, and a tile bundle from the
  # gtfs-route-tiles pipeline.
  #
  # Run `npm run worker` alongside it — that is what fills _site and _data.
  site:
    image: nginx:alpine
    container_name: transit-site-dev
    ports:
      - "8080:80"
    volumes:
      - ./_site:/usr/share/nginx/html:ro
      - ./_data:/srv/data:ro
      - ${TILES_DIR:-../gtfs-route-tiles/out/web}:/srv/tiles:ro
      - ./nginx-site.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  redis_data_dev:
