services:
  # The same nginx and the same config as production, over the working tree:
  # Eleventy's output, the worker's JSON, and a tile bundle built by tiles/.
  #
  # `npm run build:release` makes a release; `npm run worker` keeps it current.
  site:
    image: nginx:alpine
    container_name: transit-site-dev
    ports:
      - "8080:80"
    volumes:
      # Siblings, and named as they are on the host: a release points at its
      # data directory with a relative symlink, which only resolves if the two
      # sit next to each other under the same names in both places.
      - ./releases:/srv/releases:ro
      - ./_data:/srv/_data:ro
      - ./nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
