<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Map | UCP Transit Times</title>
    <meta
      name="description"
      content="Map of Greater Portland Metro routes and stops"
    />

    <!--
      The whole map — routes, stops, basemap — is in the tile bundle, so this
      page needs no framework and no data fetching to draw itself. It is served
      as a static file at /by-location (see next.config.ts) rather than
      rendered by Next.js.
    -->

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="UCP Transit" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Same one-liner the React pages inline from components/color-mode.tsx, and
      the same storage key, so a theme chosen anywhere on the site is already
      applied here before the first paint.
    -->
    <script>
      try {
        var m = localStorage.getItem("color-mode");
        if (m === "light" || m === "dark")
          document.documentElement.dataset.theme = m;
      } catch (e) {}
    </script>

    <link rel="stylesheet" href="/map/vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/map/map.css" />
  </head>
  <body>
    <div id="map" class="map"></div>

    <!-- A map that fails to load is indistinguishable from a map of the sea. -->
    <p id="map-error" class="map-error" role="alert" hidden></p>

    <!--
      Mirrors components/nav-menu.tsx: same markup, same classes out of
      app.css. The behaviour it needs — open, close, toggle theme — is at the
      bottom of map.js.
    -->
    <div class="nav" id="nav" data-open="false">
      <nav id="nav-menu-actions" class="nav-actions" aria-label="Site" inert>
        <a class="nav-action" href="/">
          <span class="nav-action-label">Home</span>
          <span class="nav-action-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960"
              width="20"
              height="20"
              aria-hidden="true"
            >
              <path
                d="M160-120v-480l320-240 320 240v480H560v-280H400v280H160Z"
              />
            </svg>
          </span>
        </a>
        <a class="nav-action" href="/by-location" aria-current="page">
          <span class="nav-action-label">Map</span>
          <span class="nav-action-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960"
              width="20"
              height="20"
              aria-hidden="true"
            >
              <path
                d="m600-120-240-84-186 72q-20 8-37-4.5T120-170v-560q0-13 7.5-23t20.5-15l212-72 240 84 186-72q20-8 37 4.5t17 33.5v560q0 13-7.5 23T812-192l-212 72Zm-40-98v-468l-160-56v468l160 56Z"
              />
            </svg>
          </span>
        </a>
        <a class="nav-action" href="/help">
          <span class="nav-action-label">Help</span>
          <span class="nav-action-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960"
              width="20"
              height="20"
              aria-hidden="true"
            >
              <path
                d="M478-240q21 0 35.5-14.5T528-290q0-21-14.5-35.5T478-340q-21 0-35.5 14.5T428-290q0 21 14.5 35.5T478-240Zm-36-154h74q0-33 7.5-52t42.5-52q26-26 41-49.5t15-56.5q0-56-41-86t-97-30q-57 0-92.5 30T342-618l66 26q5-18 22.5-39t53.5-21q32 0 48 17.5t16 38.5q0 20-12 37.5T506-526q-44 39-54 59t-10 73Zm38 314q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"
              />
            </svg>
          </span>
        </a>

        <button type="button" class="nav-action" id="theme-toggle">
          <!-- Which of these shows is decided in CSS, so the right one is
               painted on the first frame rather than after a script runs. -->
          <span class="nav-action-label">
            <span class="when-light">Dark mode</span>
            <span class="when-dark">Light mode</span>
          </span>
          <span class="nav-action-icon">
            <span class="when-light">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 -960 960 960"
                width="20"
                height="20"
                aria-hidden="true"
              >
                <path
                  d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"
                />
              </svg>
            </span>
            <span class="when-dark">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 -960 960 960"
                width="20"
                height="20"
                aria-hidden="true"
              >
                <path
                  d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"
                />
              </svg>
            </span>
          </span>
        </button>
      </nav>

      <button
        type="button"
        class="nav-fab"
        id="nav-toggle"
        aria-expanded="false"
        aria-controls="nav-menu-actions"
        aria-label="Open menu"
      >
        <span class="nav-fab-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 -960 960 960"
            width="26"
            height="26"
            aria-hidden="true"
          >
            <path
              id="nav-fab-path"
              d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"
            />
          </svg>
        </span>
      </button>
    </div>

    <script src="/map/vendor/pmtiles.js"></script>
    <script src="/map/vendor/maplibre-gl.js"></script>
    <script src="/map/map.js"></script>
  </body>
</html>
