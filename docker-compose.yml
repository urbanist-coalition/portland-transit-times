services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: transit-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost.d:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: transit-nginx-letsencrypt
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - acme:/etc/acme.sh
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

  # The whole site: pages, the JSON they poll, and the vector tiles. Static
  # files and nothing else — no application server is involved in a request.
  site:
    image: nginx:alpine
    container_name: transit-site
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - site_html:/usr/share/nginx/html:ro
      - site_data:/srv/data:ro
      # The tile bundle built by tiles/, on the host.
      - ${TILES_DIR:-./tiles}:/srv/tiles:ro
      - ./nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

  # Feeds in, files out. The only writer on the system, and the only process
  # holding any state — the schedule is a file it wrote, and a few seconds of
  # predictions live in its heap.
  worker:
    image: ghcr.io/urbanist-coalition/portland-transit-times:${IMG_TAG}
    container_name: transit-worker
    restart: unless-stopped
    command: npm run worker
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    environment:
      - SITE_DIR=/app/_site
      - DATA_DIR=/app/_data
    volumes:
      - site_html:/app/_site
      - site_data:/app/_data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

volumes:
  # The built pages. Kept on disk rather than in memory so a restart serves the
  # previous site immediately, instead of 404ing for the half minute the worker
  # takes to load the feed and rebuild.
  site_html:

  # The JSON the pages poll, rewritten every few seconds and derived entirely
  # from the release's schedule and the realtime feeds — so it lives in RAM,
  # where rewriting it costs nothing and wears nothing out. Losing it on reboot
  # costs one refresh.
  site_data:
    driver_opts:
      type: tmpfs
      device: tmpfs

  certs:
  vhost.d:
  html:
  acme:

networks:
  web:
    external: false
  backend:
    external: false
