# Serves the vector tile bundle built by gtfs-route-tiles: two PMTiles
# archives, two styles, the sprite sheets and the glyph ranges.
#
# The one hard requirement is HTTP range requests. A PMTiles archive is a single
# large file read by fetching byte ranges out of it — nginx does that for static
# files natively, which is the whole reason a plain file server is enough here
# and no tile server is involved. A server without range support would send all
# 117 MB of basemap for every tile.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;

    # .pmtiles is not in nginx's mime map; the default type is what the PMTiles
    # reader expects anyway, and the rest of the bundle (json, png, pbf) is
    # typed by the inherited mime.types.
    default_type application/octet-stream;

    # The bundle only changes when the pipeline is re-run, and every file in it
    # is rebuilt together, so it can be cached hard. A rebuild is deployed by
    # swapping the directory, not by mutating files in place.
    location ~* \.(pmtiles|pbf|png)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # The styles name the archives and are small, so they are re-checked often
    # enough that a rebuilt bundle takes effect without a hard refresh.
    location ~* \.json$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        try_files $uri =404;
    }
}
