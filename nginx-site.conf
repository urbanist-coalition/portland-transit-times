# The static site: Eleventy's output, the tile bundle, and (from phase 4) the
# JSON the worker writes. One nginx serves all three.
#
# This will grow into the production config as the Next.js app is retired; for
# now it runs alongside it in development.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Everything this server sends is text — pages, JSON, stylesheets, modules
    # — and a stop page polls its arrivals once a second. Compressing costs a
    # few microseconds of CPU and takes roughly four fifths off the wire.
    #
    # PMTiles and PNGs are already compressed and are excluded: gzipping them
    # burns CPU to make them slightly larger.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        application/json
        application/manifest+json
        application/javascript
        text/javascript
        text/css
        image/svg+xml;

    # /stops/121 redirects to /stops/121/, and by default nginx writes that
    # Location as an absolute URL built from the host name and *its own* listen
    # port — which is 80 in here, so a client on :8080 (or behind any proxy on
    # a non-default port) gets sent somewhere that does not exist. A relative
    # Location keeps whatever scheme, host and port the client actually used.
    absolute_redirect off;

    # Pages are cheap and change on every GTFS rebuild, so revalidate rather
    # than guess. nginx answers with a 304 from the file's mtime when nothing
    # has changed, which costs a header exchange.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Stylesheets and modules are named without a hash, so they cannot be
    # cached forever either — but they change only on deploy.
    location ~* \.(css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(png|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # The manifest is 700 bytes and decides whether the site can be installed
    # at all, so it revalidates rather than sitting in a browser for a day —
    # a day is how long a mistake in it would otherwise take to undo. nginx's
    # mime map has no entry for .webmanifest, hence the type.
    location = /site.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Every real stop has a page; anything else is a stop number that does not
    # exist, and the 404 page is written for that reader.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Live JSON written by the worker: service alerts now, arrivals and vehicle
    # positions once the stop pages and the map move over. Rewritten every few
    # seconds, so it must revalidate rather than sit in a browser cache — the
    # conditional request is answered from the file's mtime.
    location /data/ {
        alias /srv/data/;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    # The vector tile bundle, built by tiles/. PMTiles
    # archives are read by HTTP range request, which nginx does natively for
    # static files — the whole reason no tile server is involved.
    location /tiles/ {
        alias /srv/tiles/;
        default_type application/octet-stream;

        # Everything a style points at carries a fingerprint of its contents in
        # the URL — a query for the archives, the filename for the sprites — so
        # a rebuild is a different URL and these can be kept for as long as a
        # browser will keep anything. It also stops a client mixing byte ranges
        # from two builds of the same archive, which would have it reading one
        # file's offsets into another file's data.
        location ~* \.(pmtiles|pbf|png)$ {
            add_header Cache-Control "public, max-age=2592000, immutable" always;
        }

        location ~* /sprite[^/]*\.json$ {
            add_header Cache-Control "public, max-age=2592000, immutable" always;
        }

        # The styles are what carry those fingerprints, so they are the one
        # thing that must not be cached: an hour of holding this was an hour in
        # which a rebuilt map could not reach anyone.
        location ~* /style[^/]*\.json$ {
            add_header Cache-Control "no-cache" always;
        }
    }
}
