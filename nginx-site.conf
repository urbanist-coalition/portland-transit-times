# The static site: Eleventy's output, the tile bundle, and (from phase 4) the
# JSON the worker writes. One nginx serves all three.
#
# This will grow into the production config as the Next.js app is retired; for
# now it runs alongside it in development.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /stops/121 redirects to /stops/121/, and by default nginx writes that
    # Location as an absolute URL built from the host name and *its own* listen
    # port — which is 80 in here, so a client on :8080 (or behind any proxy on
    # a non-default port) gets sent somewhere that does not exist. A relative
    # Location keeps whatever scheme, host and port the client actually used.
    absolute_redirect off;

    # Pages are cheap and change on every GTFS rebuild, so revalidate rather
    # than guess. nginx answers with a 304 from the file's mtime when nothing
    # has changed, which costs a header exchange.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Stylesheets and modules are named without a hash, so they cannot be
    # cached forever either — but they change only on deploy.
    location ~* \.(css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(png|svg|ico|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;

        # nginx's mime map has no entry for .webmanifest, so it would go out as
        # a generic download. The images here are unaffected: a type from the
        # map always wins over default_type.
        default_type application/manifest+json;
    }

    # Every real stop has a page; anything else is a stop number that does not
    # exist, and the 404 page is written for that reader.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Live JSON written by the worker: service alerts now, arrivals and vehicle
    # positions once the stop pages and the map move over. Rewritten every few
    # seconds, so it must revalidate rather than sit in a browser cache — the
    # conditional request is answered from the file's mtime.
    location /data/ {
        alias /srv/data/;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    # The vector tile bundle, built by the gtfs-route-tiles pipeline. PMTiles
    # archives are read by HTTP range request, which nginx does natively for
    # static files — the whole reason no tile server is involved.
    location /tiles/ {
        alias /srv/tiles/;
        default_type application/octet-stream;

        location ~* \.(pmtiles|pbf|png)$ {
            add_header Cache-Control "public, max-age=2592000, immutable" always;
        }

        location ~* \.json$ {
            add_header Cache-Control "public, max-age=3600" always;
        }
    }
}
